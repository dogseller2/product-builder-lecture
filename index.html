<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물상 테스트 - 강아지 vs 고양이</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button id="theme-toggle">다크 모드</button>
        
        <header>
            <h1>동물상 테스트</h1>
            <p class="subtitle">AI가 분석하는 나의 동물상</p>
        </header>

        <main>
            <div id="test-area">
                <div id="webcam-container"></div>
                <div id="label-container"></div>
                <button type="button" id="start-btn" onclick="init()">테스트 시작하기</button>
            </div>

            <div class="contact-section">
                <hr>
                <h3>제휴 문의</h3>
                <form action="https://formspree.io/f/xlganwwy" method="POST">
                    <input type="email" name="email" placeholder="이메일 주소를 입력하세요" required>
                    <textarea name="message" placeholder="문의 내용을 입력하세요" required></textarea>
                    <button type="submit">문의하기</button>
                </form>
            </div>

            <div class="comments-section">
                <hr>
                <div id="disqus_thread"></div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="main.js"></script>
    <script>
        var disqus_config = function () {
            this.page.url = window.location.href;
            this.page.identifier = 'animal-face-test';
        };
        (function() {
            var d = document, s = d.createElement('script');
            s.src = 'https://productbuilder-gdvdfxpbdv.disqus.com/embed.js';
            s.setAttribute('data-timestamp', +new Date());
            (d.head || d.body).appendChild(s);
        })();
    </script>
</body>
</html>
